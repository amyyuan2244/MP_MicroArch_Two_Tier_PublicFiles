# Starter Envoy proxy configuration for the Premium Tier service.
#
# This YAML configures Envoy to proxy HTTP requests to the Flask API running
# on premium-tier-service. Students may use this as a base for adding routing, filters,
# or other proxy features as needed.
#
# TODO: Fill in the Envoy proxy configuration here.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901  # Admin interface port

static_resources:
  listeners:
    - name: premium_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080  # Envoy listens here
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: premium_http
                codec_type: AUTO
                route_config:
                  name: premium_route
                  virtual_hosts:
                    - name: premium_service_host
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/premium"
                            headers:
                              - name: ":method"
                                exact_match: "POST"
                          route:
                            cluster: premium_service
                            # prefix_rewrite: "/"  # Strip /premium before forwarding TODO?
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: premium_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: premium_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Kubernetes Service DNS
                      address: premium-tier-service.premium-service.svc.cluster.local
                      port_value: 5000