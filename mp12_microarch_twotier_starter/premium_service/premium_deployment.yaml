# Starter Kubernetes Deployment for the Premium Tier service.
#
# This YAML defines a deployment that runs both the Flask API and Envoy proxy
# in the 'premium-service' namespace. 
#
# TODO: Fill in the Kubernetes Deployment spec here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: premium-tier-deployment
  namespace: premium-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: premium-app
  template:
    metadata:
      labels:
        app: premium-app
    spec:
      containers:
      - name: premium-tier-app-docker
        image: amyyuan2244/premium-tier-app-docker:latest
        ports:
        - containerPort: 5000
      - name: envoy-container
        image: envoyproxy/envoy:v1.25-latest
        ports:
        - containerPort: 8080
