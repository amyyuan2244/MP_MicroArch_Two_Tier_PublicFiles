# Starter Kubernetes Deployment for the Free Tier service.
#
# This YAML defines a deployment that runs both the Flask API and Envoy proxy
# in the 'free-service' namespace. 
#
# TODO: Fill in the Kubernetes Deployment spec here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: free-tier-deployment
  labels:
    app: free-app
spec:
  # replicas: 2
  selector:
    matchLabels:
      app: free-app
  template:
    metadata:
      labels:
        app: free-app
    spec:
      containers:
      - name: amyyuan2244/free-tier-app-docker
        image: amyyuan2244/free-tier-app-docker:v1
        ports:
        - containerPort: 5000
