#
# This YAML defines a template for launching a batch job in the 'free-service' namespace.
# The job runs a container that performs a classification task.
#
# TODO: Fill in the Kubernetes Job spec here.
apiVersion: batch/v1
kind: Job
metadata:
  namespace: free-service
spec:
  template:
   spec:
      containers:
      - name: classifier # names don't need to match
        image: amyyuan2244/free-tier-app:v1  # TODO is this the docker image name here?
      restartPolicy: Never
  backoffLimit: 4